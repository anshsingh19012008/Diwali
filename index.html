<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali | Family Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f5cf6d;
            --gold-bright: #ffea9f;
            --crimson: #800e13;
            --deep-navy: #060b19;
            --card-bg: rgba(18, 10, 30, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b0c2e 0%, var(--deep-navy) 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Firework Canvas Background */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        /* Floating Light Particles Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(2px 2px at 20px 30px, #ffd700, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 90px 40px, #ff9900, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.4;
            z-index: 0;
        }

        /* Main Container Layout */
        .main-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
        }

        /* Header Section */
        header {
            margin-bottom: 25px;
        }

        .sub-heading {
            font-size: 1.1rem;
            color: var(--gold-bright);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 3.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, #ff8800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 25px rgba(245, 207, 109, 0.4);
            letter-spacing: 2px;
        }

        .greeting-msg {
            font-size: 1rem;
            color: #d1d5db;
            margin-top: 10px;
            font-style: italic;
        }

        /* Video Stage Frame */
        .video-stage {
            background: var(--card-bg);
            border: 2px solid rgba(245, 207, 109, 0.4);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 0 40px rgba(245, 207, 109, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            margin: 25px 0;
            position: relative;
        }

        .video-stage::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 24px;
            background: linear-gradient(45deg, var(--gold), transparent, var(--gold));
            z-index: -1;
            opacity: 0.4;
        }

        video {
            width: 100%;
            height: auto;
            max-height: 520px;
            border-radius: 14px;
            display: block;
            outline: none;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        /* Interactive Action Controls */
        .controls-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #b31217 0%, #e52d27 100%);
            color: #fff;
            border: 1px solid var(--gold);
            padding: 12px 26px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 45, 39, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 207, 109, 0.5);
            background: linear-gradient(135deg, #e52d27 0%, #b31217 100%);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f5cf6d 0%, #d4a329 100%);
            color: #120a1e;
            box-shadow: 0 4px 15px rgba(245, 207, 109, 0.4);
        }

        .btn-gold:hover {
            background: linear-gradient(135deg, #ffe08a 0%, #f5cf6d 100%);
        }

        /* Animated Diya Decoration Bar */
        .diya-row {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0 10px;
        }

        .diya {
            width: 36px;
            height: 18px;
            background: #d47a2a;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
            cursor: pointer;
        }

        .diya::before {
            content: '';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 16px;
            background: linear-gradient(to top, #ffcc00, #ff3300);
            border-radius: 50% 50% 20% 20%;
            animation: flicker 0.15s infinite alternate ease-in-out;
            box-shadow: 0 0 12px #ffaa00, 0 0 24px #ff3300;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-1deg); opacity: 0.95; }
            100% { transform: translateX(-50%) scale(1.1) rotate(1deg); opacity: 1; }
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #9ca3af;
            font-size: 0.85rem;
            z-index: 2;
        }

        @media (max-width: 600px) {
            .main-title { font-size: 2.2rem; }
            .sub-heading { font-size: 0.9rem; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <canvas id="fireworksCanvas"></canvas>

    <div class="main-container">
        <header>
            <div class="sub-heading">✨ Shubh Deepavali ✨</div>
            <h1 class="main-title">Happy Diwali</h1>
            <p class="greeting-msg">Warmest wishes from our family to yours for a year filled with light, joy, and prosperity!</p>
        </header>

        <div class="diya-row">
            <div class="diya" onclick="triggerBurst()"></div>
            <div class="diya" onclick="triggerBurst()"></div>
            <div class="diya" onclick="triggerBurst()"></div>
            <div class="diya" onclick="triggerBurst()"></div>
        </div>

        <div class="video-stage">
            <video id="diwaliVideo" autoplay loop muted playsinline controls>
                <source src="family_video.mp4" type="video/mp4">
            </video>
        </div>

        <div class="controls-bar">
            <button class="btn btn-gold" onclick="triggerBurst()">🎆 Burst Sparklers</button>
            <button class="btn" onclick="toggleAudio()">🎵 Play Music</button>
            <button class="btn" onclick="toggleMuteVideo()">🔊 Unmute Video</button>
        </div>
    </div>

    <footer>
        Designed for Diwali Celebrations 🪔
    </footer>

    <script>
        /* Interactive Fireworks Engine */
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2.5 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.y += 0.05; // gravity
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        function createFirework(x, y) {
            const colors = ['#f5cf6d', '#ff4d4d', '#ff944d', '#00ffcc', '#ff66cc', '#ffffff'];
            const chosenColor = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 45; i++) {
                particles.push(new Particle(x, y, chosenColor));
            }
            playPopSound();
        }

        function triggerBurst() {
            const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
            const y = Math.random() * canvas.height * 0.5 + canvas.height * 0.1;
            createFirework(x, y);
        }

        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'VIDEO') {
                createFirework(e.clientX, e.clientY);
            }
        });

        function animate() {
            ctx.fillStyle = 'rgba(6, 11, 25, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((particle, index) => {
                if (particle.alpha > 0) {
                    particle.update();
                    particle.draw();
                } else {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }
        animate();

        // Auto launch initial fireworks
        setInterval(() => {
            if (Math.random() > 0.4) triggerBurst();
        }, 2200);

        /* Audio Synthesizer (Web Audio API) */
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + Math.random() * 300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function toggleAudio() {
            initAudio();
            const btn = event.target;
            if (!isMusicPlaying) {
                isMusicPlaying = true;
                btn.textContent = "⏸ Pause Music";
                const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // Indian Pentatonic tuning
                musicInterval = setInterval(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const note = notes[Math.floor(Math.random() * notes.length)];
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.2);
                }, 400);
            } else {
                isMusicPlaying = false;
                btn.textContent = "🎵 Play Music";
                clearInterval(musicInterval);
            }
        }

        function toggleMuteVideo() {
            const vid = document.getElementById('diwaliVideo');
            const btn = event.target;
            vid.muted = !vid.muted;
            btn.textContent = vid.muted ? "🔊 Unmute Video" : "🔇 Mute Video";
        }
    </script>
</body>
</html>
